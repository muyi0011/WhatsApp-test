    <style>
        * {

        html,

        }

        .page {
            min-height: 100vh;

        }

        .container {
            width: 100%;

            text-align: center;
        }

        /* Logo */

        .logo {
            width: 76px;
            height: 76px;
            margin: 8px auto 18px;

            border-radius: 22px;

            background: #25D366;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 10px 28px rgba(37, 211, 102, 0.22);

            font-size: 40px;
        }

        /* 标题 */

        h1 {
            font-size: 28px;
            line-height: 1.3;
            font-weight: 750;

            color: #111827;

            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            line-height: 1.7;

            color: #667085;

            max-width: 390px;
            margin: 0 auto 25px;
        }

        /* 服务卡片 */

        .features {
            display: grid;
            gap: 12px;

            margin: 0 auto 26px;
        }

        .feature {
            display: flex;
            align-items: center;

            text-align: left;

            background: rgba(255, 255, 255, 0.92);

            border: 1px solid #e8eee9;

            border-radius: 15px;

            padding: 15px 16px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.035);
        }

        .feature-icon {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border-radius: 12px;

            background: #e9faef;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;

            margin-right: 13px;
        }

        .feature-content {
            flex: 1;
        }

        .feature-title {
            font-size: 15px;
            font-weight: 700;

            color: #20262e;

            margin-bottom: 3px;
        }

        .feature-text {
            font-size: 13px;

            color: #7a8490;
        }

        /* CTA */

        .cta {
            display: block;

            width: 100%;

            padding: 17px 20px;

            border-radius: 14px;

            background: #25D366;

            color: white;

            text-decoration: none;

            font-size: 17px;
            font-weight: 700;

            box-shadow:
                0 9px 24px rgba(37, 211, 102, 0.28);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .cta:active {
            transform: scale(0.98);

            box-shadow:
                0 5px 15px rgba(37, 211, 102, 0.20);
        }

        .cta-icon {
            font-size: 20px;
            margin-right: 7px;
            vertical-align: -1px;
        }

        .cta-note {
            margin-top: 11px;

            font-size: 12px;

            color: #8a939d;
        }

        /* 分隔线 */

        .divider {
            width: 70px;
            height: 1px;

            background: #e5e9e7;

            margin: 28px auto 20px;
        }

        /* 底部 */

        .footer {
            font-size: 12px;
            line-height: 1.7;

            color: #9aa2aa;
        }

        /* 桌面 */

        @media (min-width: 700px) {

            .page {
                padding-top: 70px;
            }

            .container {
                max-width: 460px;
            }

            .logo {
                width: 86px;
                height: 86px;
                font-size: 45px;
            }

            h1 {
                font-size: 31px;
            }
        }
    </style>
</head>

</html>
