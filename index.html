<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        button {
            width: 90%;
            max-width: 350px;
            padding: 16px;
            margin: 10px 0;
            border: 0;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .wa {
            background: #25D366;
            color: white;
        }

        .web {
            background: #eee;
            color: #333;
        }
    </style>
</head>

<body>

    <h2>WhatsApp 测试</h2>

    <p id="status">正在尝试打开 WhatsApp...</p>

    <button class="wa" onclick="openWhatsApp()">
        打开 WhatsApp
    </button>

    <button class="web" onclick="openWeb()">
        打开 WhatsApp 网页版
    </button>

<script>

const phone = "33641302133";

const message = "";

function openWhatsApp() {

    const appUrl =
        "whatsapp://send?phone=" +
        phone +
        (message ? "&text=" + encodeURIComponent(message) : "");

    window.location.href = appUrl;
}


function openWeb() {

    const webUrl =
        "https://wa.me/" +
        phone +
        (message ? "?text=" + encodeURIComponent(message) : "");

    window.location.href = webUrl;
}


/*
 * 自动尝试
 */

setTimeout(function () {

    document.getElementById("status").innerText =
        "正在尝试打开 WhatsApp，如果没有打开，请点击下面按钮";

    const appUrl =
        "whatsapp://send?phone=" + phone;

    window.location.href = appUrl;

}, 500);

</script>

</body>
</html>
